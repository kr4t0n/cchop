nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/kr4t0n/cchop
  # cchop 0.1.3 and Claude Code 2.1.301.
  tag: sha-4597998
  digest: sha256:a7c4b0a521c72926dffb8e77c4aedb314db8dcafaafb2b8d01b0d1cbc992f0cf
  pullPolicy: IfNotPresent
imagePullSecrets: []

setup:
  # Hold the sole pod idle for operator login/capture; Services exclude it.
  enabled: false

persistence:
  existingClaim: ""
  size: 1Gi
  # null uses the default StorageClass; "" requests no StorageClass.
  storageClass: null
  accessMode: ReadWriteOnce

auth:
  # Optional Secret with CCHOP_GATEWAY_TOKEN and CCHOP_ADMIN_TOKEN keys.
  # Otherwise use the private credentials.env created by cchop init on the PVC.
  existingSecret: ""

# Overrides the configured public URL only when nonempty.
publicUrl: ""
terminationGracePeriodSeconds: 45

service:
  relay:
    port: 8787
    annotations: {}
  admin:
    port: 8788
    annotations: {}

ingress:
  relay:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls:
      enabled: true
      secretName: ""
  admin:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls:
      enabled: true
      secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
